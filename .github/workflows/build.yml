name: APK Derle ve Yayınla

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Test ve derleme
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk Keybd.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Keybd-apk
          path: Keybd.apk
      # Uygulamanın içindeki güncelleyici bu sürümleri okur (en yeni = "latest").
      - name: GitHub sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Keybd 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}
          files: Keybd.apk
