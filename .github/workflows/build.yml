name: APK Derle ve Yayınla

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Test ve derleme
        # GitHub'ın Ubuntu sunucularında Android SDK hazır kurulu gelir (ANDROID_HOME).
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk Keybd.apk
          git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: Keybd-apk
          path: Keybd.apk
      # Uygulamanın içindeki güncelleyici bu sürümleri okur (en yeni = "latest").
      - name: GitHub sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Keybd 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: notes.md
          files: Keybd.apk
